<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los discos de Evelyn - Lista de Canciones</title>
  <!-- Tipografías modernas de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-crema: #faf6f0;
      --bg-tarjeta: #f6efe4;
      --cafe-oscuro: #3d2c20;
      --cafe-medio: #6b5344;
      --acento-terracota: #c87d55;
      --acento-hover: #a8623d;
      --borde-suave: #dec6ab;
      --margen-calido: #8f979e;
      --halo-calido: rgba(143, 151, 158, 0.32);
      --oscuro-superficie: #1c1714;
      --oscuro-elevado: #26201c;
      --texto-claro-suave: #efe6da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-crema);
      background-image: radial-gradient(#dfd3c3 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--cafe-oscuro);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.55s ease, color 0.45s ease, filter 0.45s ease;
    }

    /* Video de fondo a pantalla completa cuando suena una canción */
    #videoFondoCancion {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      filter: blur(2px) brightness(0.62) saturate(1.12);
      transition: opacity 0.5s ease, filter 0.45s ease;
    }

    #overlayVideoFondo {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: radial-gradient(circle at center, rgba(45, 29, 18, 0.16) 0%, rgba(18, 12, 8, 0.48) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background 0.45s ease;
    }

    body.tiene-video-fondo {
      background-color: #100d0b;
      background-image: none;
    }

    body.tiene-video-fondo #videoFondoCancion,
    body.tiene-video-fondo #overlayVideoFondo {
      opacity: 1;
    }

    body.modo-azul-metalico #videoFondoCancion {
      filter: grayscale(42%) contrast(0.92) brightness(0.68) hue-rotate(182deg) saturate(0.75);
    }

    body.modo-oscuro #videoFondoCancion {
      filter: blur(2px) brightness(0.5) saturate(0.95) contrast(1.06);
    }

    body.modo-bn-negro #videoFondoCancion {
      filter: grayscale(100%) blur(2px) brightness(0.52) contrast(1.1);
    }

    /* Oscurecimiento general cuando se reproduce la segunda canción (Les) */
    body.modo-oscuro {
      background-color: #14110f;
      background-image: radial-gradient(#2c241e 1px, transparent 1px);
    }

    body.modo-oscuro.tiene-video-fondo {
      background-color: #14110f;
      background-image: none;
    }

    /* Fondo negro y colores en blanco y negro cuando se reproduce la tercera canción (Noble) */
    body.modo-bn-negro {
      background-color: #050505;
      background-image: radial-gradient(#242424 1px, transparent 1px);
      color: #dcdcdc;
    }

    body.modo-bn-negro.tiene-video-fondo {
      background-color: #050505;
      background-image: none;
    }

    body.modo-bn-negro .contenedor-lista {
      background: #111111;
      border-color: #6f7478;
      color: #dcdcdc;
      filter: grayscale(100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 0 7px rgba(130, 136, 142, 0.22);
    }

    body.modo-bn-negro .info-disco h1,
    body.modo-bn-negro .titulo-cancion,
    body.modo-bn-negro .fila-cancion.activa .titulo-cancion {
      color: #ebebeb;
    }

    body.modo-bn-negro .info-disco p,
    body.modo-bn-negro .nombre-artista,
    body.modo-bn-negro .fila-cancion.activa .nombre-artista,
    body.modo-bn-negro .encabezado-columnas {
      color: #b0b0b0;
    }

    body.modo-bn-negro .etiqueta-contador {
      background-color: #1b1b1b;
      color: #d4d4d4;
      border: 1px solid #444444;
    }

    body.modo-bn-negro .cabecera-disco {
      border-bottom-color: #333333;
    }

    body.modo-bn-negro .fila-cancion {
      background-color: #161616;
      border-color: #2f2f2f;
    }

    body.modo-bn-negro .fila-cancion.activa {
      background: #090909;
      border-color: #a6a6a6;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.85);
    }

    body.modo-bn-negro .fila-cancion.activa .numero-cancion,
    body.modo-bn-negro .numero-cancion {
      color: #cfcfcf;
    }

    body.modo-bn-negro #reproductorCancionBox {
      background-color: #000000;
      border-color: #9e9e9e;
      filter: grayscale(100%) contrast(0.92);
    }

    /* Tono más opaco y metálico gris azulado sobre tonos cálidos (canción 01) */
    #overlayAzulMetalico {
      position: fixed;
      inset: -24px;
      z-index: 42;
      background:
        radial-gradient(circle at 22% 25%, rgba(124, 150, 168, 0.24), transparent 55%),
        radial-gradient(circle at 78% 70%, rgba(28, 44, 58, 0.56), transparent 60%),
        linear-gradient(135deg, rgba(16, 26, 36, 0.56) 0%, rgba(44, 62, 76, 0.36) 52%, rgba(92, 114, 130, 0.22) 100%);
      filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    body.modo-azul-metalico #overlayAzulMetalico {
      opacity: 1;
    }

    body.modo-azul-metalico .contenedor-lista {
      background: linear-gradient(160deg, rgba(24, 34, 43, 0.95) 0%, rgba(38, 52, 64, 0.93) 100%);
      border-color: #8d9aa4;
      color: #dce5ec;
      box-shadow: 0 22px 52px rgba(10, 18, 25, 0.55), 0 0 0 7px rgba(141, 154, 164, 0.28), 0 0 24px rgba(105, 128, 145, 0.16);
    }

    body.modo-azul-metalico .info-disco h1 {
      color: #e4ecf2;
    }

    body.modo-azul-metalico .info-disco p {
      color: #adc0ce;
    }

    body.modo-azul-metalico .etiqueta-contador {
      background-color: #1c2832;
      color: #c8d5de;
      border: 1px solid rgba(130, 154, 171, 0.3);
    }

    body.modo-azul-metalico .cabecera-disco {
      border-bottom-color: rgba(130, 154, 171, 0.25);
    }

    body.modo-azul-metalico .encabezado-columnas {
      color: #8b9fae;
    }

    body.modo-azul-metalico .fila-cancion {
      background-color: rgba(21, 30, 38, 0.88);
      border-color: rgba(116, 138, 154, 0.25);
    }

    body.modo-azul-metalico .titulo-cancion {
      color: #dde6ed;
    }

    body.modo-azul-metalico .nombre-artista {
      color: #9ab0bf;
    }

    body.modo-azul-metalico .fila-cancion:hover {
      background-color: rgba(31, 44, 55, 0.95);
      border-color: #7c96a8;
    }

    body.modo-azul-metalico .fila-cancion.activa {
      background: linear-gradient(120deg, #152029 0%, #273846 58%, #3f5566 100%);
      border-color: #89a5b8;
      color: #e2ebf2;
      box-shadow: 0 14px 32px rgba(10, 18, 25, 0.58), 0 0 16px rgba(124, 150, 168, 0.2);
    }

    body.modo-azul-metalico .fila-cancion.activa .numero-cancion {
      color: #a6bfd1;
    }

    body.modo-azul-metalico .fila-cancion.activa .titulo-cancion {
      color: #ecf2f7;
    }

    body.modo-azul-metalico .fila-cancion.activa .nombre-artista {
      color: #bfd0de;
    }

    /* Cambio de color de la pantalla en la primera canción hacia metálico gris azulado opaco */
    body.modo-azul-metalico #reproductorCancionBox {
      background-color: #121a21;
      border-color: #6b8496;
      box-shadow: 0 16px 34px rgba(10, 18, 25, 0.58), 0 0 20px rgba(115, 138, 156, 0.22);
    }

    body.modo-azul-metalico #reproductorCancionBox video {
      filter: grayscale(48%) contrast(0.9) brightness(0.86) hue-rotate(182deg) saturate(0.7);
    }

    /* Cambio de botones según la canción proyectada */
    body.modo-azul-metalico .btn-volver,
    body.modo-azul-metalico .btn-yt,
    body.modo-azul-metalico #btnMusicaFondo {
      background: linear-gradient(135deg, #21303c, #374b5c);
      color: #dce6ed;
      border: 1px solid #6e889b;
      box-shadow: 0 4px 12px rgba(10, 18, 25, 0.4);
    }

    body.modo-azul-metalico .btn-volver:hover,
    body.modo-azul-metalico .btn-yt:hover,
    body.modo-azul-metalico #btnMusicaFondo:hover,
    body.modo-azul-metalico #btnMusicaFondo.activa {
      background: linear-gradient(135deg, #354959, #4e677a);
      color: #eef4f8;
      border-color: #8ea7ba;
    }

    body.modo-oscuro .btn-volver,
    body.modo-oscuro .btn-yt,
    body.modo-oscuro #btnMusicaFondo {
      background: linear-gradient(135deg, #332218, #4d3424);
      color: #efe0cf;
      border: 1px solid #96684b;
      box-shadow: 0 4px 12px rgba(12, 8, 6, 0.45);
    }

    body.modo-oscuro .btn-volver:hover,
    body.modo-oscuro .btn-yt:hover,
    body.modo-oscuro #btnMusicaFondo:hover,
    body.modo-oscuro #btnMusicaFondo.activa {
      background: linear-gradient(135deg, #473022, #694731);
      color: #faf0e5;
      border-color: #b58260;
    }

    body.modo-bn-negro .btn-volver,
    body.modo-bn-negro .btn-yt,
    body.modo-bn-negro #btnMusicaFondo,
    body.modo-bn-negro .fila-cancion.activa .btn-yt {
      background: #1c1c1c;
      color: #d8d8d8;
      border: 1px solid #7d7d7d;
      box-shadow: none;
    }

    body.modo-bn-negro .btn-volver:hover,
    body.modo-bn-negro .btn-yt:hover,
    body.modo-bn-negro #btnMusicaFondo:hover,
    body.modo-bn-negro #btnMusicaFondo.activa {
      background: #303030;
      color: #ececec;
      border-color: #a6a6a6;
    }

    /* Difuminado sutil (~40%) cuando una canción está activa */
    #overlayDifuminado {
      position: fixed;
      inset: 0;
      z-index: 40;
      background-color: rgba(35, 28, 23, 0.16);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, background-color 0.5s ease;
    }

    body.modo-cancion #overlayDifuminado {
      opacity: 1;
      pointer-events: auto;
    }

    body.modo-oscuro.modo-cancion #overlayDifuminado,
    body.modo-bn-negro.modo-cancion #overlayDifuminado {
      background-color: rgba(8, 6, 5, 0.65);
    }

    /* Barra superior con efecto cristal */
    nav {
      background-color: rgba(248, 239, 226, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid var(--borde-suave);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: filter 0.4s ease, opacity 0.4s ease, background-color 0.45s ease, border-color 0.45s ease;
    }

    body.modo-cancion nav {
      filter: blur(1.5px);
      opacity: 0.85;
    }

    body.modo-oscuro nav {
      background-color: rgba(24, 18, 14, 0.92);
      border-bottom-color: #694731;
    }

    body.modo-bn-negro nav {
      background-color: rgba(18, 18, 18, 0.9);
      border-bottom-color: #2f2f2f;
    }

    body.modo-oscuro .logo,
    body.modo-bn-negro .logo {
      color: var(--texto-claro-suave);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cafe-oscuro);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-volver {
      text-decoration: none;
      color: var(--cafe-oscuro);
      font-weight: 600;
      background-color: #eedbc6;
      border: 1.5px solid var(--borde-suave);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(61, 44, 32, 0.06);
    }

    .btn-volver:hover {
      background-color: var(--cafe-oscuro);
      color: var(--texto-claro-suave);
      transform: translateX(-3px);
    }

    /* Cuadro principal con margen gris y tambaleo suave de lado a lado */
    .contenedor-lista {
      max-width: 780px;
      margin: 45px auto;
      background: linear-gradient(175deg, #fcf7ef 0%, var(--bg-tarjeta) 65%, #f2e4d0 100%);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 18px 38px rgba(30, 35, 40, 0.22), 0 0 0 8px var(--halo-calido);
      border: 2.5px solid var(--margen-calido);
      transform-origin: center center;
      animation: tambalearCuadro 4.8s ease-in-out infinite;
      position: relative;
      z-index: 50;
      transition: box-shadow 0.4s ease, border-color 0.4s ease, background 0.5s ease, background-color 0.5s ease, color 0.45s ease, filter 0.45s ease;
    }

    body.modo-cancion .contenedor-lista {
      animation-play-state: paused;
      box-shadow: 0 22px 50px rgba(20, 25, 30, 0.34), 0 0 0 8px rgba(143, 151, 158, 0.34);
      border-color: var(--margen-calido);
    }

    body.modo-oscuro .contenedor-lista {
      background: linear-gradient(175deg, #241c17 0%, #1d1815 75%, #291f18 100%);
      border-color: #7c848c;
      color: #f3e9dd;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 0 7px rgba(124, 132, 140, 0.24);
    }

    body.modo-oscuro .info-disco h1 {
      color: #f7efe4;
    }

    body.modo-oscuro .info-disco p {
      color: #cbb6a2;
    }

    body.modo-oscuro .etiqueta-contador {
      background-color: #2e231c;
      color: #ebd9c6;
      border: 1px solid #78523a;
    }

    body.modo-oscuro .cabecera-disco {
      border-bottom-color: #5c3f2d;
    }

    /* Difuminado ligero de la cabecera cuando hay una canción activa */
    .cabecera-disco {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 35px;
      padding-bottom: 30px;
      border-bottom: 1.5px dashed #d8b796;
      transition: filter 0.4s ease, opacity 0.4s ease, border-color 0.45s ease;
    }

    body.modo-cancion .cabecera-disco {
      filter: blur(2px);
      opacity: 0.72;
      pointer-events: none;
    }

    @keyframes tambalearCuadro {
      0%, 100% {
        transform: translateX(-5px) rotate(-1.4deg);
      }
      50% {
        transform: translateX(5px) rotate(1.4deg);
      }
    }

    /* Vinilo animado en CSS puro */
    .vinilo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #1e1b18,
        #1e1b18 4px,
        #2d2824 5px,
        #1e1b18 6px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      animation: girar 12s linear infinite;
      position: relative;
      transition: box-shadow 0.4s ease, filter 0.4s ease, background 0.4s ease;
    }

    .vinilo::after {
      content: "";
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #2b211b 18%, var(--acento-terracota) 20%);
      border: 2px solid #e8cfa9;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* Giro más ágil al reproducirse la música/video de una canción */
    body.modo-cancion .vinilo {
      animation-duration: 2.6s;
    }

    /* Colores opacos del disco según la canción que suena */
    body.modo-azul-metalico .vinilo {
      filter: saturate(0.65) brightness(0.9);
      box-shadow: 0 0 22px rgba(105, 128, 145, 0.42), 0 8px 22px rgba(12, 22, 30, 0.55);
    }

    body.modo-azul-metalico .vinilo::after {
      background: radial-gradient(circle, #121c24 18%, #5b7587 20%, #233442 85%);
      border-color: #8da6b8;
    }

    body.modo-oscuro .vinilo {
      box-shadow: 0 0 18px rgba(155, 102, 65, 0.35), 0 8px 22px rgba(0, 0, 0, 0.65);
    }

    body.modo-oscuro .vinilo::after {
      background: radial-gradient(circle, #0e0b09 18%, #6e472d 20%, #241913 85%);
      border-color: #94694c;
    }

    body.modo-bn-negro .vinilo {
      filter: grayscale(100%) brightness(0.9);
      box-shadow: 0 0 18px rgba(180, 180, 180, 0.25), 0 8px 22px rgba(0, 0, 0, 0.85);
    }

    body.modo-bn-negro .vinilo::after {
      background: radial-gradient(circle, #050505 18%, #7a7a7a 20%, #262626 85%);
      border-color: #b5b5b5;
    }

    @keyframes girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .info-disco h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 0 0 8px;
      color: var(--cafe-oscuro);
    }

    .info-disco p {
      margin: 0 0 12px;
      color: var(--cafe-medio);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .etiqueta-contador {
      display: inline-block;
      background-color: #eedbc6;
      color: var(--cafe-oscuro);
      border: 1px solid var(--borde-suave);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Lista de canciones con Grid */
    .lista-canciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .encabezado-columnas {
      display: grid;
      grid-template-columns: 45px 1.4fr 1.2fr 125px;
      align-items: center;
      padding: 0 18px 6px;
      color: #8f745e;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      transition: filter 0.4s ease, opacity 0.4s ease, color 0.4s ease;
    }

    body.modo-cancion .encabezado-columnas {
      filter: blur(1.5px);
      opacity: 0.72;
    }

    .encabezado-columnas span:first-child {
      text-align: center;
    }

    .encabezado-columnas span:last-child {
      text-align: right;
    }

    .fila-cancion {
      display: grid;
      grid-template-columns: 45px 1.4fr 1.2fr 125px;
      align-items: center;
      padding: 15px 18px;
      background-color: #f6ede0;
      border: 1.5px solid #e2c5a6;
      border-radius: 16px;
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.3s ease,
                  filter 0.4s ease,
                  opacity 0.4s ease;
    }

    body.modo-oscuro .fila-cancion {
      background-color: #261e19;
      border-color: #593e2d;
    }

    body.modo-oscuro .titulo-cancion {
      color: #f6ede2;
    }

    body.modo-oscuro .nombre-artista {
      color: #c8b29d;
    }

    .fila-cancion:hover {
      background-color: #eddcc6;
      border-color: var(--acento-terracota);
      transform: scale(1.03) translateY(-3px);
      box-shadow: 0 12px 24px rgba(200, 125, 85, 0.22);
      z-index: 10;
    }

    body.modo-oscuro .fila-cancion:hover {
      background-color: #30251e;
    }

    /* Canción seleccionada */
    .fila-cancion.activa {
      background-color: var(--oscuro-superficie);
      border-color: var(--acento-terracota);
      color: var(--texto-claro-suave);
      box-shadow: 0 14px 32px rgba(200, 125, 85, 0.28);
      filter: none !important;
      opacity: 1 !important;
      z-index: 20;
    }

    .fila-cancion.activa .titulo-cancion {
      color: var(--texto-claro-suave);
    }

    .fila-cancion.activa .nombre-artista {
      color: #cbbba9;
    }

    body.modo-oscuro .fila-cancion.activa {
      background-color: #30241d;
      border-color: #cf8961;
    }

    /* Las demás canciones se atenúan y difuminan suavemente (~40%) */
    body.modo-cancion .fila-cancion:not(.activa) {
      filter: blur(2px);
      opacity: 0.72;
      pointer-events: none;
    }

    .numero-cancion {
      font-weight: 700;
      color: var(--acento-terracota);
      text-align: center;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fila-cancion:hover .numero-cancion {
      transform: scale(1.2);
    }

    .titulo-cancion {
      font-weight: 700;
      color: var(--cafe-oscuro);
      padding-right: 10px;
      transition: color 0.25s ease, transform 0.3s ease;
    }

    .fila-cancion:hover .titulo-cancion {
      color: var(--acento-hover);
    }

    .nombre-artista {
      color: var(--cafe-medio);
      font-weight: 500;
      padding-right: 10px;
    }

    .accion-cancion {
      text-align: right;
    }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #c2784e;
      color: var(--texto-claro-suave);
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 3px 8px rgba(150, 92, 60, 0.22);
    }

    .btn-yt:hover {
      background-color: #9e5c38;
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(150, 92, 60, 0.35);
    }

    /* Caja de video que aparece justo debajo de la canción seleccionada */
    #reproductorCancionBox {
      display: none;
      opacity: 0;
      transform: translateY(-6px);
      border-radius: 18px;
      overflow: hidden;
      background-color: #14110f;
      border: 2px solid var(--acento-terracota);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      transition: opacity 0.6s ease, transform 0.5s ease, border-color 0.45s ease, box-shadow 0.45s ease, filter 0.45s ease, background-color 0.45s ease;
      position: relative;
      z-index: 25;
    }

    #reproductorCancionBox.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #reproductorCancionBox.desvaneciendo {
      opacity: 0;
      transform: translateY(-6px);
    }

    #reproductorCancionBox video {
      width: 100%;
      max-height: 340px;
      display: block;
      object-fit: cover;
      background-color: #000000;
      transition: filter 0.45s ease;
    }

    /* Botón flotante y cartel de música de fondo */
    #btnMusicaFondo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background-color: #2b2019;
      color: var(--texto-claro-suave);
      border: 2px solid #c2784e;
      padding: 10px 16px;
      border-radius: 22px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(20, 15, 12, 0.28);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.2s ease,
                  color 0.2s ease,
                  border-color 0.35s ease;
    }

    #btnMusicaFondo:hover {
      transform: scale(1.06);
      background-color: #c2784e;
      color: var(--texto-claro-suave);
    }

    #btnMusicaFondo.activa {
      background-color: #c2784e;
      color: var(--texto-claro-suave);
    }

    #toastNowPlaying {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 998;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 16px;
      background-color: rgba(34, 25, 19, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(230, 198, 165, 0.32);
      color: rgba(239, 230, 218, 0.94);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toastNowPlaying.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #toastNowPlaying .np-label {
      color: #e0ae8d;
      font-weight: 600;
    }

    #toastNowPlaying .np-track {
      font-weight: bold;
      color: var(--texto-claro-suave);
    }

    /* Adaptación para celulares */
    @media (max-width: 650px) {
      .cabecera-disco {
        flex-direction: column;
        text-align: center;
      }
      .contenedor-lista {
        margin: 20px 15px;
        padding: 25px 18px;
      }
      nav {
        padding: 14px 18px;
      }
      .encabezado-columnas {
        display: none;
      }
      .fila-cancion {
        grid-template-columns: 35px 1fr auto;
        grid-template-areas:
          "num titulo boton"
          "num artista boton";
        gap: 2px 10px;
        padding: 14px;
      }
      .numero-cancion {
        grid-area: num;
      }
      .titulo-cancion {
        grid-area: titulo;
      }
      .nombre-artista {
        grid-area: artista;
        font-size: 0.85rem;
      }
      .accion-cancion {
        grid-area: boton;
      }
      .fila-cancion:hover {
        transform: scale(1.02) translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <video id="videoFondoCancion" loop muted playsinline></video>
  <div id="overlayVideoFondo"></div>
  <div id="overlayDifuminado"></div>
  <div id="overlayAzulMetalico"></div>

  <!-- Menú Superior -->
  <nav>
    <a href="index.html" class="logo">💿 Los discos de Evelyn</a>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>
  </nav>

  <!-- Contenedor Principal (se tambalea todo junto) -->
  <div class="contenedor-lista" id="cuadroPrincipal">
    
    <div class="cabecera-disco">
      <div class="vinilo"></div>
      <div class="info-disco">
        <h1>Estas canciones me relajan</h1>
        <p>las canciones son lindas.</p>
        <span class="etiqueta-contador">🎵 3 canciones en esta lista</span>
      </div>
    </div>

    <!-- Lista de canciones con tarjetas uniformes -->
    <div class="lista-canciones" id="listaCanciones">
      <div class="encabezado-columnas">
        <span>#</span>
        <span>Canción</span>
        <span>Artista</span>
        <span>Escuchar</span>
      </div>

      <div class="fila-cancion"
           data-audio="when_you_find_me.mp3"
           data-video="when_you_find_me.mp4"
           data-titulo="When you find me [Plenka]"
           data-azul="true">
        <span class="numero-cancion">01</span>
        <span class="titulo-cancion">When you find me</span>
        <span class="nombre-artista">Plenka</span>
        <div class="accion-cancion">
          <a href="https://youtu.be/-yee7X7zhrw?si=gICFCQ4NTmAnLARi" target="_blank" rel="noopener noreferrer" class="btn-yt">
            ▶ YouTube
          </a>
        </div>
      </div>

      <div class="fila-cancion"
           data-audio="les.mp3"
           data-video="les.mp4"
           data-titulo="Les [Childish gambino]"
           data-oscuro="true">
        <span class="numero-cancion">02</span>
        <span class="titulo-cancion">Les</span>
        <span class="nombre-artista">Childish gambino</span>
        <div class="accion-cancion">
          <a href="https://youtu.be/L8gGHqPBuZM?si=KqleqvaellkUSmeC" target="_blank" rel="noopener noreferrer" class="btn-yt">
            ▶ YouTube
          </a>
        </div>
      </div>

      <div class="fila-cancion"
           data-audio="noble.mp3"
           data-video="noble.mp4"
           data-titulo="Noble [F3miii]"
           data-bn="true">
        <span class="numero-cancion">03</span>
        <span class="titulo-cancion">Noble</span>
        <span class="nombre-artista">F3miii</span>
        <div class="accion-cancion">
          <a href="https://youtu.be/YskL2pz4j_Y?si=36KtH4UnOuwTp8oO" target="_blank" rel="noopener noreferrer" class="btn-yt">
            ▶ YouTube
          </a>
        </div>
      </div>

      <!-- Caja de video que se coloca justo debajo de la canción seleccionada -->
      <div id="reproductorCancionBox">
        <video id="videoCancion" playsinline></video>
      </div>
    </div>

  </div>

  <!-- Controles de música de fondo -->
  <button type="button" id="btnMusicaFondo">🎵 Música: OFF</button>

  <div id="toastNowPlaying">
    <span class="np-label">🎶 Esta Sonando:</span>
    <span class="np-track" id="textoNowPlaying">Veridis quo [Daft punk]</span>
  </div>

  <script>
    const musicaFondo = new Audio('fondo.mp3');
    musicaFondo.loop = true;
    musicaFondo.volume = 0.35;

    const audioCancion = new Audio();
    audioCancion.volume = 0.85;

    const btnMusica = document.getElementById('btnMusicaFondo');
    const toastNowPlaying = document.getElementById('toastNowPlaying');
    const textoNowPlaying = document.getElementById('textoNowPlaying');
    const overlayDifuminado = document.getElementById('overlayDifuminado');
    const listaCanciones = document.getElementById('listaCanciones');
    const reproductorBox = document.getElementById('reproductorCancionBox');
    const videoCancion = document.getElementById('videoCancion');
    const videoFondoCancion = document.getElementById('videoFondoCancion');
    const filasCancion = document.querySelectorAll('.fila-cancion');

    const CLAVE_ACTIVA = 'evelyn_musica_activa';
    const CLAVE_TIEMPO = 'evelyn_musica_tiempo';
    const NOMBRE_FONDO = 'Veridis quo [Daft punk]';

    let cancionActivaFila = null;
    let estabaFondoActivaAntes = false;
    let temporizadorCierre = null;

    function guardarEstado() {
      localStorage.setItem(CLAVE_ACTIVA, !musicaFondo.paused ? '1' : '0');
      localStorage.setItem(CLAVE_TIEMPO, musicaFondo.currentTime.toString());
    }

    function actualizarBoton() {
      const estaSonando = !musicaFondo.paused;
      btnMusica.textContent = estaSonando ? '🎵 Música: ON' : '🎵 Música: OFF';
      btnMusica.classList.toggle('activa', estaSonando);

      if (cancionActivaFila) {
        textoNowPlaying.textContent = cancionActivaFila.dataset.titulo;
        toastNowPlaying.classList.add('visible');
      } else {
        textoNowPlaying.textContent = NOMBRE_FONDO;
        toastNowPlaying.classList.toggle('visible', estaSonando);
      }
      guardarEstado();
    }

    function detenerVideoFondo() {
      document.body.classList.remove('tiene-video-fondo');
      videoFondoCancion.pause();
      videoFondoCancion.currentTime = 0;
      videoFondoCancion.removeAttribute('src');
      videoFondoCancion.load();
    }

    function activarVideoFondo(srcVideo) {
      if (!srcVideo) {
        detenerVideoFondo();
        return;
      }
      document.body.classList.add('tiene-video-fondo');
      videoFondoCancion.src = srcVideo;
      videoFondoCancion.currentTime = 0;
      videoFondoCancion.play().catch(() => {});
    }

    function cerrarCancionActiva() {
      clearTimeout(temporizadorCierre);
      reproductorBox.classList.add('desvaneciendo');
      detenerVideoFondo();

      temporizadorCierre = setTimeout(() => {
        audioCancion.pause();
        audioCancion.currentTime = 0;

        videoCancion.pause();
        videoCancion.currentTime = 0;
        videoCancion.muted = true;
        videoCancion.removeAttribute('src');
        videoCancion.load();

        reproductorBox.classList.remove('visible', 'desvaneciendo');
        listaCanciones.appendChild(reproductorBox);
        document.body.classList.remove('modo-cancion', 'modo-oscuro', 'modo-azul-metalico', 'modo-bn-negro', 'tiene-video-fondo');

        if (cancionActivaFila) {
          cancionActivaFila.classList.remove('activa');
          cancionActivaFila = null;
        }

        if (estabaFondoActivaAntes) {
          musicaFondo.play().then(() => {
            actualizarBoton();
          }).catch(() => {
            actualizarBoton();
          });
        } else {
          actualizarBoton();
        }
      }, 650);
    }

    filasCancion.forEach((fila) => {
      fila.addEventListener('click', (e) => {
        if (e.target.closest('.btn-yt')) return;

        clearTimeout(temporizadorCierre);

        if (cancionActivaFila === fila) {
          cerrarCancionActiva();
          return;
        }

        if (!cancionActivaFila) {
          estabaFondoActivaAntes = !musicaFondo.paused;
        }
        musicaFondo.pause();

        filasCancion.forEach((f) => f.classList.remove('activa'));
        fila.classList.add('activa');
        cancionActivaFila = fila;

        document.body.classList.add('modo-cancion');
        document.body.classList.toggle('modo-oscuro', fila.dataset.oscuro === 'true');
        document.body.classList.toggle('modo-azul-metalico', fila.dataset.azul === 'true');
        document.body.classList.toggle('modo-bn-negro', fila.dataset.bn === 'true');

        fila.insertAdjacentElement('afterend', reproductorBox);

        const srcAudio = fila.dataset.audio;
        const srcVideo = fila.dataset.video;

        activarVideoFondo(srcVideo);

        reproductorBox.classList.remove('desvaneciendo');
        reproductorBox.classList.add('visible');

        videoCancion.muted = true;
        videoCancion.src = srcVideo;
        videoCancion.currentTime = 0;
        videoCancion.play().catch(() => {});

        audioCancion.src = srcAudio;
        audioCancion.currentTime = 0;
        audioCancion.play().catch(() => {
          videoCancion.muted = false;
          videoCancion.play().catch(() => {});
        });

        actualizarBoton();
      });
    });

    videoCancion.addEventListener('ended', () => {
      cerrarCancionActiva();
    });

    audioCancion.addEventListener('ended', () => {
      cerrarCancionActiva();
    });

    overlayDifuminado.addEventListener('click', () => {
      if (cancionActivaFila) {
        cerrarCancionActiva();
      }
    });

    btnMusica.addEventListener('click', () => {
      if (musicaFondo.paused) {
        musicaFondo.play().then(() => {
          actualizarBoton();
        }).catch(() => {});
      } else {
        musicaFondo.pause();
        actualizarBoton();
      }
    });

    setInterval(() => {
      if (!musicaFondo.paused) {
        guardarEstado();
      }
    }, 500);

    window.addEventListener('beforeunload', guardarEstado);

    window.addEventListener('DOMContentLoaded', () => {
      const estabaActiva = localStorage.getItem(CLAVE_ACTIVA) === '1';
      const tiempoGuardado = parseFloat(localStorage.getItem(CLAVE_TIEMPO) || '0');

      if (!isNaN(tiempoGuardado) && tiempoGuardado > 0) {
        musicaFondo.addEventListener('loadedmetadata', () => {
          musicaFondo.currentTime = tiempoGuardado % (musicaFondo.duration || tiempoGuardado + 1);
        }, { once: true });
      }

      if (estabaActiva) {
        musicaFondo.play().then(() => {
          actualizarBoton();
        }).catch(() => {
          actualizarBoton();
        });
      } else {
        actualizarBoton();
      }
    });
  </script>
</body>
</html>
