<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbumes - Los discos de Evelyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-crema: #faf6f0;
      --bg-tarjeta: #ffffff;
      --cafe-oscuro: #3d2c20;
      --cafe-medio: #6b5344;
      --acento-terracota: #c87d55;
      --acento-hover: #a8623d;
      --dorado-suave: #d9a773;
      --borde-suave: #ede2d5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-crema);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(200, 125, 85, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(61, 44, 32, 0.06) 0%, transparent 45%),
        radial-gradient(#dfd3c3 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--cafe-oscuro);
      margin: 0;
      padding: 0 0 80px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.45s ease;
    }

    /* Video de fondo con el video de la canción reproduciéndose */
    #videoFondoAlbum {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      filter: blur(1.5px) brightness(0.75) saturate(1.12);
      transition: opacity 0.5s ease;
    }

    #overlayVideoFondo {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: radial-gradient(circle at center, rgba(35, 28, 23, 0.12) 0%, rgba(20, 15, 12, 0.42) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    body.tiene-video-fondo {
      background-color: #16110e;
      background-image: none;
    }

    body.tiene-video-fondo #videoFondoAlbum,
    body.tiene-video-fondo #overlayVideoFondo {
      opacity: 1;
    }

    body.modo-cancion #overlayVideoFondo {
      pointer-events: auto;
    }

    /* Barra superior */
    nav {
      background-color: rgba(250, 246, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde-suave);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    body.modo-cancion nav {
      filter: blur(1.5px);
      opacity: 0.85;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cafe-oscuro);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-volver {
      text-decoration: none;
      color: var(--cafe-oscuro);
      font-weight: 600;
      background-color: #ffffff;
      border: 1px solid var(--borde-suave);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(61, 44, 32, 0.04);
    }

    .btn-volver:hover {
      background-color: var(--cafe-oscuro);
      color: #ffffff;
      transform: translateX(-3px);
    }

    /* Contenedor general */
    .pagina-albumes {
      max-width: 920px;
      margin: 34px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 25;
    }

    /* Sección 1: Estante / Galería de Álbumes */
    .encabezado-coleccion {
      text-align: center;
      margin-bottom: 24px;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    body.modo-cancion .encabezado-coleccion,
    body.modo-cancion .estante-albumes {
      filter: blur(2px);
      opacity: 0.65;
      pointer-events: none;
    }

    .subtitulo-coleccion {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--acento-terracota);
      background: #f4ebe1;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 8px;
    }

    .encabezado-coleccion h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      margin: 0;
      color: var(--cafe-oscuro);
    }

    .estante-albumes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 34px;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    .tarjeta-album {
      background: #ffffff;
      border: 2px solid var(--borde-suave);
      border-radius: 22px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
      box-shadow: 0 8px 20px rgba(92, 67, 50, 0.05);
    }

    .tarjeta-album:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--acento-terracota);
      box-shadow: 0 14px 28px rgba(200, 125, 85, 0.18);
    }

    .tarjeta-album.activo {
      border-color: var(--acento-terracota);
      background: linear-gradient(135deg, #ffffff 0%, #fcf5ed 100%);
      box-shadow: 0 14px 30px rgba(200, 125, 85, 0.22);
    }

    .tarjeta-album.activo::after {
      content: "EN ESCUCHA";
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ffffff;
      background: var(--acento-terracota);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .mini-portada {
      width: 62px;
      height: 62px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 6px 14px rgba(61, 44, 32, 0.16);
      position: relative;
    }

    .info-mini-album h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      margin: 0 0 4px;
      color: var(--cafe-oscuro);
    }

    .info-mini-album span {
      font-size: 0.8rem;
      color: var(--cafe-medio);
      display: block;
    }

    /* Sección 2: Escenario Principal del Álbum Seleccionado */
    .escenario-album {
      background: var(--bg-tarjeta);
      border: 1.5px solid var(--borde-suave);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 20px 45px rgba(92, 67, 50, 0.09);
      position: relative;
      z-index: 50;
      animation: flotarSuave 5.5s ease-in-out infinite;
      transition: box-shadow 0.4s ease, opacity 0.25s ease, transform 0.25s ease, background 0.4s ease, backdrop-filter 0.4s ease, border-color 0.4s ease;
    }

    .escenario-album.cambiando {
      opacity: 0.35;
      transform: scale(0.985);
    }

    /* Todo el cuadro difuminado y al 20% de opacidad cuando suena una canción */
    body.modo-cancion .escenario-album {
      animation-play-state: paused;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-color: rgba(255, 255, 255, 0.42);
      box-shadow: 0 24px 55px rgba(20, 15, 12, 0.32);
    }

    body.modo-cancion .escenario-album h1,
    body.modo-cancion .escenario-album p,
    body.modo-cancion .escenario-album .titulo-cancion,
    body.modo-cancion .escenario-album .nombre-artista,
    body.modo-cancion .escenario-album .encabezado-columnas {
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.72);
    }

    @keyframes flotarSuave {
      0%, 100% { transform: translateY(0px) rotate(-0.5deg); }
      50% { transform: translateY(-5px) rotate(0.5deg); }
    }

    /* Portada de Álbum + Vinilo que sale al reproducir */
    .cabecera-epica {
      display: flex;
      align-items: center;
      gap: 48px;
      padding-bottom: 34px;
      margin-bottom: 30px;
      border-bottom: 1.5px dashed #dfcfbe;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    .conjunto-portada {
      position: relative;
      width: 175px;
      height: 175px;
      flex-shrink: 0;
    }

    /* Vinilo detrás de la funda */
    .disco-vinilo {
      position: absolute;
      top: 10px;
      right: -24px;
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 26%, rgba(255,255,255,0.06) 27%, transparent 28%),
        repeating-radial-gradient(#1b1815, #1b1815 4px, #2b2622 5px, #1b1815 6px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: girarVinilo 10s linear infinite;
      animation-play-state: paused;
    }

    body.modo-cancion .disco-vinilo {
      transform: translateX(34px);
      animation-play-state: running;
    }

    .disco-vinilo::after {
      content: "";
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #faf6f0 18%, var(--acento-terracota) 20%, #8f4e2d 95%);
      border: 2px solid #f0e6d8;
    }

    @keyframes girarVinilo {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    /* Funda / Carátula del Álbum */
    .funda-album {
      position: relative;
      z-index: 2;
      width: 175px;
      height: 175px;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(61, 44, 32, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }

    .funda-album::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 50%, rgba(0,0,0,0.25) 100%);
      pointer-events: none;
    }

    .funda-sello {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 20px;
      align-self: flex-start;
    }

    .funda-icono {
      font-size: 2.8rem;
      align-self: center;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
    }

    .funda-pie {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      font-style: italic;
      opacity: 0.92;
    }

    .detalles-album {
      flex: 1;
    }

    .etiquetas-superiores {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pill-meta {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
      background-color: rgba(244, 235, 225, 0.85);
      color: var(--cafe-oscuro);
    }

    .pill-meta.destacado {
      background-color: var(--acento-terracota);
      color: #ffffff;
    }

    .detalles-album h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 0 0 10px;
      color: var(--cafe-oscuro);
      line-height: 1.15;
    }

    .detalles-album p {
      margin: 0 0 16px;
      color: var(--cafe-medio);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    /* Lista de canciones (Tracklist) */
    .lista-canciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .encabezado-columnas {
      display: grid;
      grid-template-columns: 48px 1.4fr 1.2fr 130px;
      align-items: center;
      padding: 0 18px 6px;
      color: #968172;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 800;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    .encabezado-columnas span:first-child { text-align: center; }
    .encabezado-columnas span:last-child { text-align: right; }

    .fila-cancion {
      display: grid;
      grid-template-columns: 48px 1.4fr 1.2fr 130px;
      align-items: center;
      padding: 15px 18px;
      background-color: rgba(252, 250, 247, 0.78);
      border: 1.5px solid rgba(240, 231, 220, 0.85);
      border-radius: 16px;
      font-size: 0.96rem;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.3s ease,
                  opacity 0.4s ease;
    }

    .fila-cancion:hover {
      background-color: rgba(255, 255, 255, 0.92);
      border-color: var(--acento-terracota);
      transform: scale(1.025) translateY(-3px);
      box-shadow: 0 12px 24px rgba(200, 125, 85, 0.2);
      z-index: 10;
    }

    .fila-cancion.activa {
      background-color: rgba(255, 255, 255, 0.92);
      border-color: var(--acento-terracota);
      box-shadow: 0 14px 28px rgba(200, 125, 85, 0.24);
      opacity: 1 !important;
      z-index: 20;
    }

    body.modo-cancion .fila-cancion:not(.activa) {
      opacity: 0.75;
    }

    .numero-cancion {
      font-weight: 800;
      color: var(--acento-terracota);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Barras de ecualizador cuando la pista suena */
    .ecualizador {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .fila-cancion.activa .num-texto { display: none; }
    .fila-cancion.activa .ecualizador { display: inline-flex; }

    .ecualizador i {
      width: 3px;
      background: var(--acento-terracota);
      border-radius: 3px;
      animation: ecualizar 0.8s ease-in-out infinite;
    }

    .ecualizador i:nth-child(2) { animation-delay: 0.2s; }
    .ecualizador i:nth-child(3) { animation-delay: 0.4s; }

    @keyframes ecualizar {
      0%, 100% { height: 5px; }
      50% { height: 16px; }
    }

    .titulo-cancion {
      font-weight: 700;
      color: var(--cafe-oscuro);
      padding-right: 10px;
      transition: color 0.25s ease;
    }

    .fila-cancion:hover .titulo-cancion,
    .fila-cancion.activa .titulo-cancion {
      color: var(--acento-hover);
    }

    .nombre-artista {
      color: var(--cafe-medio);
      font-weight: 500;
      padding-right: 10px;
    }

    .accion-cancion {
      text-align: right;
    }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--acento-terracota);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 3px 8px rgba(200, 125, 85, 0.25);
    }

    .btn-yt:hover {
      background-color: var(--acento-hover);
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(200, 125, 85, 0.4);
    }

    /* Caja de video integrada debajo de la canción */
    #reproductorCancionBox {
      display: none;
      opacity: 0;
      transform: translateY(-6px);
      border-radius: 18px;
      overflow: hidden;
      background-color: #ffffff;
      border: 2px solid var(--acento-terracota);
      box-shadow: 0 14px 30px rgba(92, 67, 50, 0.16);
      transition: opacity 0.45s ease, transform 0.45s ease;
      position: relative;
      z-index: 25;
    }

    #reproductorCancionBox.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #reproductorCancionBox.desvaneciendo {
      opacity: 0;
      transform: translateY(-6px);
    }

    #reproductorCancionBox video {
      width: 100%;
      max-height: 360px;
      display: block;
      object-fit: cover;
      background-color: #faf6f0;
    }

    /* Botón flotante y cartel de música de fondo */
    #btnMusicaFondo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background-color: #faf6f0;
      color: #5c4332;
      border: 2px solid #c87d55;
      padding: 10px 16px;
      border-radius: 22px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(92, 67, 50, 0.16);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.2s ease,
                  color 0.2s ease;
    }

    #btnMusicaFondo:hover,
    #btnMusicaFondo.activa {
      background-color: #c87d55;
      color: #ffffff;
    }

    #btnMusicaFondo:hover {
      transform: scale(1.06);
    }

    #toastNowPlaying {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 998;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 16px;
      background-color: rgba(43, 38, 35, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(230, 216, 199, 0.25);
      color: rgba(250, 246, 240, 0.95);
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toastNowPlaying.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #toastNowPlaying .np-label {
      color: #e6b89c;
      font-weight: 600;
    }

    #toastNowPlaying .np-track {
      font-weight: bold;
      color: #ffffff;
    }

    /* Responsivo */
    @media (max-width: 780px) {
      .estante-albumes {
        grid-template-columns: 1fr;
      }
      .cabecera-epica {
        flex-direction: column;
        text-align: center;
        gap: 24px;
      }
      .etiquetas-superiores {
        justify-content: center;
      }
    }

    @media (max-width: 600px) {
      .escenario-album {
        padding: 24px 16px;
      }
      nav {
        padding: 14px 18px;
      }
      .encabezado-columnas {
        display: none;
      }
      .fila-cancion {
        grid-template-columns: 36px 1fr auto;
        grid-template-areas:
          "num titulo boton"
          "num artista boton";
        gap: 2px 10px;
        padding: 14px;
      }
      .numero-cancion { grid-area: num; }
      .titulo-cancion { grid-area: titulo; }
      .nombre-artista { grid-area: artista; font-size: 0.85rem; }
      .accion-cancion { grid-area: boton; }
    }
  </style>
</head>
<body>
  <video id="videoFondoAlbum" loop muted playsinline></video>
  <div id="overlayVideoFondo"></div>

  <!-- Menú Superior -->
  <nav>
    <a href="index.html" class="logo">💿 Los discos de Evelyn</a>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>
  </nav>

  <main class="pagina-albumes">
    <!-- Estante de Álbumes -->
    <div class="encabezado-coleccion">
      <span class="subtitulo-coleccion">Colección Oficial</span>
      <h2>Selecciona un Álbum</h2>
    </div>

    <section class="estante-albumes" id="estanteAlbumes"></section>

    <!-- Escenario del Álbum Activo -->
    <section class="escenario-album" id="escenarioAlbum">
      <div class="cabecera-epica">
        <div class="conjunto-portada">
          <div class="disco-vinilo"></div>
          <div class="funda-album" id="fundaAlbum">
            <span class="funda-sello" id="fundaSello">VOL. 01</span>
            <span class="funda-icono" id="fundaIcono">✨</span>
            <span class="funda-pie" id="fundaPie">Edición Especial</span>
          </div>
        </div>

        <div class="detalles-album">
          <div class="etiquetas-superiores">
            <span class="pill-meta destacado" id="albumGenero">Pop & Nostalgia</span>
            <span class="pill-meta" id="albumAnio">2026</span>
            <span class="pill-meta" id="albumContador">🎵 4 canciones</span>
          </div>
          <h1 id="albumTitulo">Título del Álbum</h1>
          <p id="albumDescripcion">Descripción o dedicatoria del álbum.</p>
        </div>
      </div>

      <!-- Lista de Canciones -->
      <div class="lista-canciones" id="listaCanciones">
        <div class="encabezado-columnas">
          <span>#</span>
          <span>Canción</span>
          <span>Artista</span>
          <span>Escuchar</span>
        </div>
        <!-- Las filas se generan automáticamente desde el catálogo de álbumes -->
      </div>

      <!-- Reproductor de Video -->

        <video id="videoCancion" playsinline></video>
      </div>
    </section>
  </main>

  <!-- Música de fondo -->

  <script>
    /* =========================================================================

    const ALBUMES = [

          {

          },
          {

            artista: 'peas',
            youtube: 'https://youtu.be/OpK12KUzUW0?si=Kicq6-tceNWIZss-´',

          }
        ]
      }
    
        
      
    ];

    /* =========================================================================
       LÓGICA DEL REPRODUCTOR Y SELECTOR DE ÁLBUMES
       ========================================================================= */
    const musicaFondo = new Audio('fondo.mp3');
    musicaFondo.loop = true;
    musicaFondo.volume = 0.35;

    const audioCancion = new Audio();
    audioCancion.volume = 0.85;

    const estanteAlbumes = document.getElementById('estanteAlbumes');
    const escenarioAlbum = document.getElementById('escenarioAlbum');
    const fundaAlbum = document.getElementById('fundaAlbum');
    const fundaSello = document.getElementById('fundaSello');
    const fundaIcono = document.getElementById('fundaIcono');
    const fundaPie = document.getElementById('fundaPie');
    const albumGenero = document.getElementById('albumGenero');
    const albumAnio = document.getElementById('albumAnio');
    const albumContador = document.getElementById('albumContador');
    const albumTitulo = document.getElementById('albumTitulo');
    const albumDescripcion = document.getElementById('albumDescripcion');
    const listaCanciones = document.getElementById('listaCanciones');
    const reproductorBox = document.getElementById('reproductorCancionBox');
    const videoCancion = document.getElementById('videoCancion');
    const videoFondoAlbum = document.getElementById('videoFondoAlbum');
    const overlayVideoFondo = document.getElementById('overlayVideoFondo');
    const btnMusica = document.getElementById('btnMusicaFondo');
    const toastNowPlaying = document.getElementById('toastNowPlaying');
    const textoNowPlaying = document.getElementById('textoNowPlaying');

    const CLAVE_ACTIVA = 'evelyn_musica_activa';
    const CLAVE_TIEMPO = 'evelyn_musica_tiempo';
    const NOMBRE_FONDO = 'Veridis quo [Daft punk]';

    let albumActualIndex = 0;
    let cancionActivaFila = null;
    let estabaFondoActivaAntes = false;
    let temporizadorCierre = null;

    function guardarEstado() {
      localStorage.setItem(CLAVE_ACTIVA, !musicaFondo.paused ? '1' : '0');
      localStorage.setItem(CLAVE_TIEMPO, musicaFondo.currentTime.toString());
    }

    function actualizarBoton() {
      const estaSonando = !musicaFondo.paused;
      btnMusica.textContent = estaSonando ? '🎵 Música: ON' : '🎵 Música: OFF';
      btnMusica.classList.toggle('activa', estaSonando);

      if (cancionActivaFila) {
        textoNowPlaying.textContent = cancionActivaFila.dataset.titulo;
        toastNowPlaying.classList.add('visible');
      } else {
        textoNowPlaying.textContent = NOMBRE_FONDO;
        toastNowPlaying.classList.toggle('visible', estaSonando);
      }
      guardarEstado();
    }

    function detenerVideoFondoCancion() {
      document.body.classList.remove('tiene-video-fondo');
      videoFondoAlbum.pause();
      videoFondoAlbum.currentTime = 0;
      videoFondoAlbum.removeAttribute('src');
      videoFondoAlbum.load();
    }

    function activarVideoFondoCancion(srcVideo) {
      if (!srcVideo) {
        detenerVideoFondoCancion();
        return;
      }
      document.body.classList.add('tiene-video-fondo');
      videoFondoAlbum.src = srcVideo;
      videoFondoAlbum.currentTime = 0;
      videoFondoAlbum.play().catch(() => {});
    }

    function cerrarCancionActiva(inmediato = false) {
      clearTimeout(temporizadorCierre);
      detenerVideoFondoCancion();

      const ejecutarCierre = () => {
        audioCancion.pause();
        audioCancion.currentTime = 0;

        videoCancion.pause();
        videoCancion.currentTime = 0;
        videoCancion.muted = true;
        videoCancion.removeAttribute('src');
        videoCancion.load();

        reproductorBox.classList.remove('visible', 'desvaneciendo');
        escenarioAlbum.appendChild(reproductorBox);
        document.body.classList.remove('modo-cancion', 'tiene-video-fondo');

        if (cancionActivaFila) {
          cancionActivaFila.classList.remove('activa');
          cancionActivaFila = null;
        }

        if (estabaFondoActivaAntes) {
          musicaFondo.play().then(actualizarBoton).catch(actualizarBoton);
        } else {
          actualizarBoton();
        }
      };

      if (inmediato) {
        ejecutarCierre();
      } else {
        reproductorBox.classList.add('desvaneciendo');
        temporizadorCierre = setTimeout(ejecutarCierre, 450);
      }
    }

    function renderizarEstante() {
      estanteAlbumes.innerHTML = '';
      ALBUMES.forEach((album, idx) => {
        const card = document.createElement('div');
        card.className = 'tarjeta-album' + (idx === albumActualIndex ? ' activo' : '');
        card.innerHTML = `
          <div class="mini-portada" style="background: ${album.gradiente};">${album.icono}</div>
          <div class="info-mini-album">
            <h3>${album.titulo}</h3>
            <span>${album.canciones.length} canciones · ${album.genero}</span>
          </div>
        `;
        card.addEventListener('click', () => {
          if (idx === albumActualIndex) return;
          seleccionarAlbum(idx);
        });
        estanteAlbumes.appendChild(card);
      });
    }

    function seleccionarAlbum(index) {
      if (cancionActivaFila) {
        cerrarCancionActiva(true);
      }
      albumActualIndex = index;
      const album = ALBUMES[index];

      escenarioAlbum.classList.add('cambiando');
      renderizarEstante();

      setTimeout(() => {
        fundaAlbum.style.background = album.gradiente;
        fundaSello.textContent = album.sello;
        fundaIcono.textContent = album.icono;
        fundaPie.textContent = album.piePortada;

        albumGenero.textContent = album.genero;
        albumAnio.textContent = album.anio;
        albumContador.textContent = `🎵 ${album.canciones.length} canciones`;
        albumTitulo.textContent = album.titulo;
        albumDescripcion.textContent = album.descripcion;

        const encabezado = listaCanciones.querySelector('.encabezado-columnas');
        listaCanciones.innerHTML = '';
        listaCanciones.appendChild(encabezado);

        album.canciones.forEach((cancion, i) => {
          const numero = String(i + 1).padStart(2, '0');
          const fila = document.createElement('div');
          fila.className = 'fila-cancion';
          fila.dataset.audio = cancion.audio;
          fila.dataset.video = cancion.video;
          fila.dataset.titulo = `${cancion.titulo} [${cancion.artista}]`;

          fila.innerHTML = `
            <span class="numero-cancion">
              <span class="num-texto">${numero}</span>
              <span class="ecualizador"><i></i><i></i><i></i></span>
            </span>
            <span class="titulo-cancion">${cancion.titulo}</span>
            <span class="nombre-artista">${cancion.artista}</span>
            <div class="accion-cancion">
              <a href="${cancion.youtube}" target="_blank" rel="noopener noreferrer" class="btn-yt">
                ▶ YouTube
              </a>
            </div>
          `;

          fila.addEventListener('click', (e) => {
            if (e.target.closest('.btn-yt')) return;

            clearTimeout(temporizadorCierre);

            if (cancionActivaFila === fila) {
              cerrarCancionActiva();
              return;
            }

            if (!cancionActivaFila) {
              estabaFondoActivaAntes = !musicaFondo.paused;
            }
            musicaFondo.pause();

            listaCanciones.querySelectorAll('.fila-cancion').forEach(f => f.classList.remove('activa'));
            fila.classList.add('activa');
            cancionActivaFila = fila;
            document.body.classList.add('modo-cancion');

            const srcAudio = fila.dataset.audio;
            const srcVideo = fila.dataset.video;

            activarVideoFondoCancion(srcVideo);

            fila.insertAdjacentElement('afterend', reproductorBox);

            reproductorBox.classList.remove('desvaneciendo');
            reproductorBox.classList.add('visible');

            videoCancion.muted = true;
            videoCancion.src = srcVideo;
            videoCancion.currentTime = 0;
            videoCancion.play().catch(() => {});

            audioCancion.src = srcAudio;
            audioCancion.currentTime = 0;
            audioCancion.play().catch(() => {
              videoCancion.muted = false;
              videoCancion.play().catch(() => {});
            });

            actualizarBoton();
          });

          listaCanciones.appendChild(fila);
        });

        escenarioAlbum.classList.remove('cambiando');
      }, 180);
    }

    videoCancion.addEventListener('ended', () => cerrarCancionActiva());
    audioCancion.addEventListener('ended', () => cerrarCancionActiva());

    overlayVideoFondo.addEventListener('click', () => {
      if (cancionActivaFila) cerrarCancionActiva();
    });

    btnMusica.addEventListener('click', () => {
      if (musicaFondo.paused) {
        musicaFondo.play().then(actualizarBoton).catch(() => {});
      } else {
        musicaFondo.pause();
        actualizarBoton();
      }
    });

    setInterval(() => {
      if (!musicaFondo.paused) guardarEstado();
    }, 500);

    window.addEventListener('beforeunload', guardarEstado);

    window.addEventListener('DOMContentLoaded', () => {
      seleccionarAlbum(0);

      const estabaActiva = localStorage.getItem(CLAVE_ACTIVA) === '1';
      const tiempoGuardado = parseFloat(localStorage.getItem(CLAVE_TIEMPO) || '0');

      if (!isNaN(tiempoGuardado) && tiempoGuardado > 0) {
        musicaFondo.addEventListener('loadedmetadata', () => {
          musicaFondo.currentTime = tiempoGuardado % (musicaFondo.duration || tiempoGuardado + 1);
        }, { once: true });
      }

      if (estabaActiva) {
        musicaFondo.play().then(actualizarBoton).catch(actualizarBoton);
      } else {
        actualizarBoton();
      }
    });
  </script>
